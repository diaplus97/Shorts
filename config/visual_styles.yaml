# Style Bible (spec v0.2 section 19.1).
#
# Text-to-video models reach for glowing holograms and floating UI the moment a
# prompt sounds technical. This file exists mainly to push back on that: the
# `avoid` list is applied to every scene as a negative prompt, regardless of
# what the director wrote.

style:
  genre: documentary CGI
  realism:
    photorealistic: true
    physically_plausible: true
  palette:
    - industrial
    - neutral
    - desaturated
  camera:
    - smooth
    - cinematic
    - physically possible camera motion
  lighting:
    - practical light sources
    - soft directional key
    - no artificial rim glow
  transitions:
    - match cut
    - continuous tracking
    - cutaway reveal
    - macro push-in
  avoid:
    - fantasy glow
    - sci-fi holograms
    - holographic projection
    - floating UI panels
    - random UI overlays
    - floating labels
    - generated text
    - captions
    - watermarks
    - logos
    - brand names
    - excessive lens flare
    - glowing data streams
    - neon blue circuitry
    - distorted human hands
    - extra limbs
    - uncanny faces

reality_type_style:
  observed:
    suffix: "shot as real-world documentary footage"
  reconstructed:
    suffix: >
      technical cutaway reconstruction, engineering-accurate proportions,
      clean sectional view, real materials and surfaces
  conceptual:
    suffix: >
      explanatory diagrammatic visualisation, flat graphic treatment, clearly
      stylised so it is not mistaken for real internal footage
