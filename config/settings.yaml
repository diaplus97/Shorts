# Committed defaults. These stay on mock providers so a fresh checkout runs
# without touching a paid API.
#
# Do not edit this file for machine-specific choices -- every `git pull` will
# collide with them. Put those in config/settings.local.yaml instead, which is
# gitignored and merged over this file at load time:
#
#   cp config/settings.local.yaml.example config/settings.local.yaml
#
# Non-secret runtime configuration.
# Secrets belong in .env (see .env.example).

project_root: projects

providers:
  llm: mock          # mock | openai
  search: mock       # mock
  image: mock        # mock
  video: mock        # mock
  tts: mock          # mock | openai

llm:
  model: gpt-4o-mini
  temperature: 0.4
  max_output_tokens: 8000
  timeout_sec: 120
  # A structured-output failure is retried exactly once with the validation
  # error appended to the prompt. Never loop forever (spec section 65).
  structured_output_retries: 1

search:
  max_queries: 6
  max_results_per_query: 6

research:
  target_claims: 10

quality:
  # Structural QA always runs. The LLM fact-check prompt is opt-in because it
  # costs money and the structural checks catch most problems.
  llm_fact_check: false
  strict: false

  audio:
    # A voice track quieter than this, or mostly silence, fails the render.
    # Guards against shipping 55 seconds of nothing.
    # -50 dB means 'essentially silent'; real speech sits near -25 dB.
    min_mean_volume_db: -50.0
    max_silence_ratio: 0.5
    silence_threshold_db: -50.0
    min_silence_sec: 0.5

video:
  model: mock-video-1
  aspect_ratio: "9:16"
  # Mock jobs finish immediately; a Veo job takes minutes. Raise both of these
  # when switching providers.video to veo.
  poll_interval_sec: 2
  poll_timeout_sec: 900
  max_clip_duration_sec: 8.0

  # --- Veo -----------------------------------------------------------------
  # Used only when providers.video is "veo". To switch, set:
  #   providers.video: veo
  #   video.model: veo-3.1-fast-generate-preview
  #   video.allowed_durations: [4, 6, 8]    (required: Veo clips are fixed length)
  #   video.poll_interval_sec: 15
  # and put VIDEO_API_KEY in .env.
  #
  # Veo 3 (veo-3.0-generate-001, veo-3.0-fast-generate-001) and Veo 2 were shut
  # down on 2026-06-30. Use a Veo 3.1 id. Checked 2026-08-19; model ids move, so
  # confirm against Google's current documentation.
  #
  #   veo-3.1-generate-preview        Standard, $0.40/s
  #   veo-3.1-fast-generate-preview   Fast,     $0.15/s   <- start here
  #
  # Veo 3.1 supports aspectRatio 9:16, durationSeconds 4/6/8, and resolution
  # 720p/1080p/4K. 1080p at 9:16 gives 1080x1920, which is exactly our output.
  base_url: https://generativelanguage.googleapis.com/v1beta
  # Clip lengths the model returns. Empty means continuous (mock only). A
  # request is rounded UP to the shortest length that covers it, so this also
  # decides what you are billed.
  allowed_durations: []
  sample_count: 1
  # veo-3.1-fast-generate-preview answers HTTP 400 to allow_adult:
  #   "allow_adult for personGeneration is currently not supported."
  # Left empty so the field is not sent and the API default applies. Our scenes
  # are machine interiors and the negative prompt already bans human figures.
  person_generation:
  resolution: 1080p
  # Veo 3.1 generates audio natively and rejects this field outright:
  #   HTTP 400 "`generateAudio` isn't supported by this model"
  # Leave it empty so the field is never sent. Set true/false only for a model
  # that documents the parameter. Either way audio is included in the
  # per-second price, and normalisation strips it before our narration is mixed.
  generate_audio:
  timeout_sec: 120
  download_timeout_sec: 600
  # Passed through verbatim into the request parameters. Use this for a field
  # this code does not know about rather than editing the provider.
  extra_parameters: {}

image:
  model: mock-image-1
  width: 1080
  height: 1920

tts:
  model: mock-tts-1
  voice: default
  format: wav
  sample_rate: 24000

script:
  # The reference Short in tests/fixtures/benchmark/ is 476 characters, about
  # 77 seconds. A 70s ceiling cannot hold the shape it is the model for, and
  # the first real run was refused at 76.4s for exceeding a limit that was
  # itself wrong.
  target_duration_sec: 70
  min_duration_sec: 45
  max_duration_sec: 85
  # Rough speaking rate used for duration estimation before TTS exists.
  # Korean narration, measured in characters per second.
  chars_per_sec: 6.2
  # Planned pauses add silence on top of the spoken characters. The duration
  # window above is the finished video, so the writer gets a smaller text budget.
  pause_budget_sec: 6.0

scenes:
  min_scenes: 8
  max_scenes: 14
  min_scene_duration_sec: 1.5
  max_scene_duration_sec: 9.0

subtitles:
  max_lines: 2
  # Korean glyphs are roughly one font_size wide, so this must fit inside
  # (width - 2 * margin_h) / font_size.
  max_chars_per_line: 15
  min_cue_duration_sec: 0.8
  # Output pixels. margin_v keeps cues clear of the Shorts UI safe area.
  margin_v: 320
  margin_h: 60
  font_size: 64
  outline: 4
  shadow: 1
  # ASS colour is &HBBGGRR, not RGB. This is a warm amber.
  emphasis_colour: "&H0055D7FF"
  # Must be a font installed on this machine that can render Korean.
  font_name: "Noto Sans CJK KR"
  burn_in: true

output:
  width: 1080
  height: 1920
  fps: 30
  video_codec: libx264
  video_preset: medium
  video_crf: 20
  pixel_format: yuv420p
  audio_codec: aac
  audio_bitrate: 192k
  audio_sample_rate: 48000
  # Silence appended after the narration so the last scene is not clipped.
  tail_padding_sec: 0.4

audio:
  voice_gain_db: 0.0
  bgm_gain_db: -18.0
  # Ducking is only applied when a BGM track is supplied.
  duck_ratio: 8
  duck_threshold: 0.05

retry:
  provider_max_attempts: 4
  provider_backoff_initial_sec: 2.0
  provider_backoff_max_sec: 30.0

logging:
  level: INFO
  json_file: logs/pipeline.jsonl
