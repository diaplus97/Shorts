name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and a Korean-capable font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk

      - name: Install the package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Doctor
        run: python -m shorts_factory doctor

      # Live provider tests are excluded: CI must never call a paid API.
      - name: Tests
        run: pytest -m "not live" -q

      - name: Smoke test
        run: python scripts/smoke_test.py
