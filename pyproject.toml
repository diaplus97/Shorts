[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-factory"
version = "0.1.0"
description = "CLI-first production pipeline for Invisible Systems YouTube Shorts"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
shorts = "shorts_factory.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shorts_factory = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets every test module `import factories` for the shared object builders.
pythonpath = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits real paid provider APIs; requires ALLOW_LIVE_API_TESTS=1",
    "media: requires a working ffmpeg/ffprobe installation",
]
filterwarnings = ["error::DeprecationWarning:shorts_factory.*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]  # typer uses function calls in argument defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["shorts_factory"]

[tool.mypy]
python_version = "3.12"
files = ["src/shorts_factory"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
